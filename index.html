let deck=cards.map((c,i)=>({id:i+1,q:c[0],a:c[1],group:c[2]}));let shown=[...deck],index=0,revealed=false,seen=new Set(),selected=new Map(),choiceCache=new Map();
const $=id=>document.getElementById(id);function choicesFor(c){if(choiceCache.has(c.id))return choiceCache.get(c.id);const pool=[...new Set(deck.map(x=>x.a).filter(a=>a!==c.a))];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const opts=[c.a,...pool.slice(0,3)];for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}choiceCache.set(c.id,opts);return opts}function render(){if(!shown.length)return;const c=shown[index];$('tag').textContent=c.group;$('prompt').textContent=c.q;$('answerText').textContent=c.a;$('answer').classList.toggle('show',revealed);$('reveal').textContent=revealed?'Hide answer':'Reveal answer';const box=$('options');box.replaceChildren();choicesFor(c).forEach((option,i)=>{const b=document.createElement('button');b.type='button';b.className='option';if(selected.get(c.id)===option)b.classList.add('selected');if(revealed&&option===c.a)b.classList.add('correct');if(revealed&&selected.get(c.id)===option&&option!==c.a)b.classList.add('incorrect');const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i)+'.';const text=document.createElement('span');text.textContent=option;b.append(letter,text);b.addEventListener('click',()=>{selected.set(c.id,option);seen.add(c.id);render()});box.append(b)});$('counter').textContent=`Question ${index+1} of ${shown.length}`;$('subcounter').textContent=`Overall question ${c.id} · ${c.group.startsWith('Enumeration')?'Enumeration':'Identification'}`;$('seen').textContent=`${seen.size} answered`; $('bar').style.width=`${(seen.size/shown.length)*100}%`;}

function move(d){index=(index+d+shown.length)%shown.length;revealed=false;render()}
$('filter').addEventListener('change',setFilter);$('reveal').addEventListener('click',reveal);$('next').addEventListener('click',()=>move(1));$('prev').addEventListener('click',()=>move(-1));$('restart').addEventListener('click',()=>{index=0;revealed=false;seen.clear();selected.clear();render()});$('shuffle').addEventListener('click',()=>{for(let i=shown.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shown[i],shown[j]]=[shown[j],shown[i]]}index=0;revealed=false;render()});document.addEventListener('keydown',e=>{if(e.target.matches('select,button'))return;if(e.code==='Space'){e.preventDefault();reveal()}if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
